name: Feature request
description: Suggest a capability Meridian does not have yet.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Meridian does not support today?
    validations:
      required: true

  - type: textarea
    id: proposed-capability
    attributes:
      label: Proposed capability
      description: What should Meridian be able to do? Describe the outcome, not the implementation.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you handle it today
      description: Which tool or workaround do you use for this now, if any?

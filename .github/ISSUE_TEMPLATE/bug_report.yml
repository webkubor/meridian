name: Bug report
description: Something in Meridian does not work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste private repository contents, credentials, or tokens.**

        Bug reports are public. Before submitting, remove anything from a private
        repository (file contents, diffs, commit messages) and any credentials,
        access tokens, or SSH key material. Replace real names and paths with
        placeholders such as `<private-repo>`.

  - type: input
    id: version
    attributes:
      label: Meridian version
      description: Shown in the app's About panel (Meridian → About Meridian).
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Shown in System Settings → General → About, or by running `sw_vers -productVersion`.
      placeholder: "13.6"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Machine architecture
      options:
        - Apple silicon
        - Intel
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact error message if there is one.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps that shows the bug.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report / 诊断报告
      description: |
        Optional, but often what turns "it fails" into something fixable.
        In Meridian open About Meridian → Diagnostics and choose Copy report; the
        app fills this box for you when you report a bug from there. If the
        report is too long to fit, choose Export report instead and attach the
        saved .txt file.

        The report lists the app and macOS versions, recent failed commands with
        their error codes, and the end of the log file. It never includes file
        contents, diffs, commit messages or credentials. Home folders, logins
        inside URLs and token-shaped strings are masked. Masking is automatic,
        not perfect: read the report before you post it.

        这是选填项，但诊断报告往往能帮助我们定位问题。在 Meridian 中打开「关于 Meridian → 诊断」，选择「复制报告」；从应用内提交问题时，应用会自动填入此栏。报告太长而无法填入时，请选择「导出报告」并附上保存的 .txt 文件。

        报告包含应用与 macOS 版本、最近失败的命令及错误码，以及日志末尾内容。报告不会包含文件内容、差异、提交说明或凭据；主目录路径、URL 中的登录信息和类似令牌的字符串会被遮盖。自动脱敏并不完美，发布前请先阅读报告。
      placeholder: Paste the report here / 在此粘贴诊断报告。

  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Sensitive data
      description: Bug reports are public — confirm the report is safe to publish.
      options:
        - label: I have removed all private repository contents, credentials, tokens, and other sensitive data from this report.
          required: true

# Meridian's Rust side is a Cargo workspace from day one: the Tauri host crate
# is the root package, and the layers below it (domain / engine / validation /
# commands) are modules of this crate for now (docs/02 §2). New members — e.g.
# splitting `engine` into its own crate so the dependency rules become
# compiler-enforced — can be added here without moving the app.
[workspace]
members = ["."]

[package]
name = "meridian"
version = "0.1.0"
description = "Meridian — a Git client for macOS, built as Tauri + Vue 3 on a git2 engine"
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
git2 = { version = "0.21", features = ["ssh", "https"] }
tokio = { version = "1.53", features = ["rt", "sync"] }
tauri-plugin-updater = "2.12.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2.3.1"
# Driven from Rust only (see `app_pick_directory`): the webview gets no
# dialog permission, so there is nothing for a script to reach either.
tauri-plugin-dialog = "2.4.0"
serde_json = "1.0.154"
log = "0.4.34"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
regex = "1.13.1"
dirs = "7.0.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
